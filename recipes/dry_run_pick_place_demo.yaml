id: dry_run_pick_place_demo
name: Dry Run Pick Place Demo
description: Simulator-only pick/place style motion with no payload, no heat, and no real tooling.
locked: false
requires_homing: true
requires_calibration: false
requires_verified_workspace: false
requires_real_motion: false
steps:
  - type: recipe_note
    text: Dry-run pick/place demo uses simulated joints and gripper only.
  - type: move_joint
    joint_id: joint_1
    position: -12.0
    speed: 0.25
  - type: set_gripper
    position: 0.15
  - type: wait
    seconds: 0.05
  - type: move_joint
    joint_id: joint_1
    position: 12.0
    speed: 0.25
  - type: set_gripper
    position: 0.65
