[platformio]
default_envs = cookbot_mega2560
src_dir = mega_firmware/cookbot_mega_firmware

[env:cookbot_mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

[env:cookbot_mega2560_bench]
extends = env:cookbot_mega2560
build_flags =
  -DCOOKBOT_BENCH_OUTPUTS_ENABLED=1

[env:cookbot_mega2560_ramps14_commissioning]
extends = env:cookbot_mega2560
build_flags =
  -DCOOKBOT_HARDWARE_CONFIGURED=1
  -DCOOKBOT_RAMPS14_COMMISSIONING=1
