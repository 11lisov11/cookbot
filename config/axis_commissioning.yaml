  B:
    label: Vendor B motor / RAMPS X channel
    step_pin: 54
    dir_pin: 55
    enable_pin: 38
    limit_id: B_MIN
    limit_pin: 3
    home_direction: 0
    away_direction: 1
    gearbox_ratio_likely: 10
    observations:
      - A bounded 4000us seek reached B_MIN in 2052 steps during initial commissioning.
      - A later 8000us edge scan did not reach B_MIN within 12000 steps; no away move was issued.
      - A subsequent 6000-to-4000us bounded seek did not reach B_MIN within 10000 steps.
      - The latest session found B_MIN inactive; a direction-1 seek did not hit it within 500 steps and the axis was returned by 500 commanded direction-0 steps.
      - A 100-step symmetric pulse test was accepted by firmware, but there is no encoder feedback proving physical travel.
    status: inconsistent_limit_or_motion_path_requires_physical_inspection
  C:
    label: Vendor C motor / RAMPS Z channel
    step_pin: 46
    dir_pin: 48
    enable_pin: 62
    limit_id: C_MIN
    limit_pin: 18
    home_direction: 0
    away_direction: 1
    gearbox_ratio_likely: 10
    observations:
      - A bounded 4000us seek reached C_MIN in 3521 steps during initial commissioning.
      - At 8000us C reached C_MIN in 5146 steps, moved away 5000 steps, and returned in 5047 steps.
      - Persistent-session 600-step flat moves returned in 496, 389, 440, 429, and 431 steps across 2000, 4000, 8000, 12000, and 1000us profiles.
      - Two persistent ramped 4000-to-500us moves returned in 654 and 631 steps.
      - Latest 8000us flat cycles returned in 844, 563, 577, and 356 steps for identical 600-step away commands.
      - A 12000us 600-step away command did not release C_MIN; the edge-scan guard now rejects this false movement result.
      - Two 8000-to-6000us ramped away commands returned in 540 and 453 steps.
      - The non-monotonic offset indicates switch travel, backlash, load slip, or mechanical compliance; it is not explained by STEP frequency alone.
    status: blocked_for_positioning_due_to_lost_steps_or_mechanical_slip
  E0:
    label: Slider motor / RAMPS E0 channel
    step_pin: 26
    dir_pin: 28
    enable_pin: 24
    limit_id: null
    limit_pin: null
    gearbox_ratio: 1
    learned_profile:
      pulse_us: 8
      start_delay_us: 12000
      min_delay_us: 12000
      accel_steps: 0
      decel_steps: 0
      step_backend: digital
      repeated_cycles: 4
      steps_per_direction: 600
    observations:
      - Short flat-timing cycles moved with manual supervision.
      - A 6250-step ramp reaching 5000us did not move reliably and produced skipped-step sounds.
      - Persistent-session symmetric 600-step commands completed at 8000us and 5000us; no encoder or limit exists to verify physical travel.
      - Latest symmetric 600-step commands completed at flat 5000us and 3000us timings.
      - A 10000-to-2000us ramp completed 600 steps in each direction, but no encoder or limit can prove the physical distance.
    status: short_motion_observed_no_limit_or_linear_calibration
