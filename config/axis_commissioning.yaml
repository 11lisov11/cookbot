project: CookBot
controller: Arduino Mega + RAMPS 1.4 commissioning firmware
hardware_observations:
  stepper_drivers:
    user_reported_type: A4988
    module_style: red stepstick
    confidence: user_reported
    note: Current limit is set by the physical Vref potentiometer and the module's Rsense value; firmware cannot raise A4988 motor current.
  gearboxes:
    A:
      user_reported_part_number: FLE 42-010
      user_reported_serial_number: H202600130
      inferred_ratio: 10
      confidence: likely
      note: FLE42-010 style listings identify 010 as a 10:1 gearbox ratio; verify against the exact vendor datasheet before final calibration.
    B:
      user_reported_part_number: FLE 42-010
      user_reported_serial_number: H202600130
      inferred_ratio: 10
      confidence: likely
      note: A and B are the two lift-arm geared motors per user inspection.
    C:
      user_reported_part_number: FLE 42-010
      user_reported_serial_number: H202600230
      inferred_ratio: 10
      confidence: likely
      note: C uses the same apparent 10:1 FLE42 gearbox family with a different serial number.
    E0:
      user_reported_part_number: null
      user_reported_serial_number: null
      inferred_ratio: 1
      confidence: user_reported
      note: Slider has no external gearbox; speed limits come from motor microstepping, driver current, and the slider transmission/load.
axes:
  A:
    label: Vendor A motor / RAMPS Y channel
    step_pin: 60
    dir_pin: 61
    enable_pin: 56
    limit_id: A_MIN
    limit_pin: 14
    home_direction: 0
    away_direction: 1
    learned_from:
      - docs/hardware_evidence/vendor_controller_wiring.png
      - RAMPS 1.4 commissioning tests on COM6
    learned_profiles:
      smooth_stable:
        away_steps: 1200
        start_delay_us: 7000
        min_delay_us: 1850
        accel_steps: 500
        repeated_seek_steps: [1264, 1264, 1264]
      sharp_stable_default:
        away_steps: 1200
        start_delay_us: 1850
        min_delay_us: 1850
        accel_steps: 0
        repeated_seek_steps: [1264, 1264, 1264]
      fast_move_away_previous_default:
        away_steps: 1200
        start_delay_us: 1850
        min_delay_us: 1000
        accel_steps: 250
        measured_by_seek_profile:
          start_delay_us: 1850
          min_delay_us: 1850
          accel_steps: 0
        repeated_seek_steps: [1264, 1264, 1263]
      rapid_a_cli_default:
        away_steps: 1200
        pulse_us: 3
        start_delay_us: 1850
        min_delay_us: 250
        accel_steps: 0
        decel_steps: 0
        move_elapsed_seconds: [0.383, 0.383, 0.383]
        measured_by_seek_profile:
          pulse_us: 4
          start_delay_us: 1850
          min_delay_us: 1850
          accel_steps: 0
          decel_steps: 0
        repeated_seek_steps: [1264, 1264, 1264]
        confirmed_cli_default_seek_steps: 1264
      rapid_a_smoother_stable:
        away_steps: 1200
        pulse_us: 3
        start_delay_us: 1850
        min_delay_us: 250
        accel_steps: 50
        decel_steps: 50
        move_elapsed_seconds: [0.475, 0.475, 0.475]
